apiVersion: v1
kind: Namespace
metadata:
  name: three-tier-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Network Policy - Default deny all incoming traffic

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: three-tier-app

spec:
  podSelector: {}

  policyTypes:
    - Ingress


---
# Allow frontend to access backend

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-frontend-to-backend
  namespace: three-tier-app

spec:

  podSelector:
    matchLabels:
      app: backend

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend

      ports:
        - protocol: TCP
          port: 8080


---
# Pod Security Policy using Security Context

apiVersion: v1
kind: ConfigMap

metadata:
  name: security-config
  namespace: three-tier-app

data:

  security-rules.yaml: |

    runAsNonRoot: true

    allowPrivilegeEscalation: false

    readOnlyRootFilesystem: true

    capabilities:
      drop:
        - ALL
