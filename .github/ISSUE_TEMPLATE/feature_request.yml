name: Feature Request
description: Suggest a new feature, improvement, or enhancement for the project
title: "[FEATURE]: "
labels:
  - enhancement

body:

  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.
        Please provide details about the proposed feature and its benefits.


  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the feature or improvement you would like to add.
      placeholder: |
        Example:
        Add automatic rollback support for failed Kubernetes deployments.
    validations:
      required: true


  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Explain the problem or limitation this feature solves.
      placeholder: |
        What problem are you trying to solve?


  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Select the area related to this request.
      options:
        - Application Development
        - Docker Containerization
        - Kubernetes / Amazon EKS
        - Terraform Infrastructure
        - CI/CD Pipeline
        - GitOps / ArgoCD
        - Monitoring & Observability
        - Security / DevSecOps
        - Documentation


  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Explain your suggested implementation approach.
      placeholder: |
        Describe how this feature can be implemented.


  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Mention any alternative solutions or workarounds you tried.


  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, references, or any other useful details.
