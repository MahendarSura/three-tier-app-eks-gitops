name: Test Application

on:
  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        pip install -r src/backend/requirements.txt

    - name: Run tests
      run: |
        pytest tests/
