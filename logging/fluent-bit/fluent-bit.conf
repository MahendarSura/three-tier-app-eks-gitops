[SERVICE]
    Flush        5
    Log_Level    info
    Daemon       off
    Parsers_File parsers.conf


# Collect Kubernetes container logs
[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Parser            docker
    Tag               kube.*
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On


# Add Kubernetes metadata
[FILTER]
    Name                kubernetes
    Match               kube.*
    Merge_Log           On
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On


# Send logs to Elasticsearch
[OUTPUT]
    Name            es
    Match           kube.*
    Host            elasticsearch.monitoring.svc.cluster.local
    Port            9200
    Logstash_Format On
    Retry_Limit     False
